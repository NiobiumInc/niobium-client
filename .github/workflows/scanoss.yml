name: SCANOSS License Compliance

# Which branch: the repo's DEFAULT branch, read when the workflow runs
# (github.event.repository.default_branch in each job's `if`), never named
# here. An `on:` filter cannot read the default branch, and naming main/master
# meant repos whose default is something else were never scanned on push or PR
# (openfhe-development and FIDESlib-fork: nb_main; qemu-fhe: niobium_master,
# 2026-09-29) -- and any repo whose default is renamed later would stop
# silently. So every branch starts the workflow, and on any branch but the
# default every job is skipped: no runner is taken, self-hosted included, no
# scan runs, and a skipped required check does not block a merge.
on:
  pull_request:
  push:
    branches: ['**']   # every branch, but not tags
    # Trigger-level guard: pushes that only touch these paths never start the
    # workflow at all (free — no runner, no scan). GitHub evaluates the
    # workflow file from the pushed commit, so this protects the very merge
    # that introduces it. NOTE: kept OFF pull_request — a paths-ignored PR
    # would hang forever on any repo where scanoss-pr is a required check.
    paths-ignore:
      - 'NOTICE'
      - '.github/workflows/scanoss.yml'
  # Manual rescan from the Actions tab → "SCANOSS License Compliance" → "Run workflow".
  # Behaves like a push (full scan + ORT trigger). Use this to re-run after
  # adding/editing .scanoss-curations.json or scanoss.json without bumping a commit.
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: write

concurrency:
  group: scanoss-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scanoss-pr:
    name: SCANOSS License Scan (PR)
    if: github.event_name == 'pull_request' && github.base_ref == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: SCANOSS Delta Scan
        uses: scanoss/gha-code-scan@v1
        with:
          # Pinned to match the ORT VM's scanoss-py (upgraded 2026-07-17).
          # Bump deliberately alongside VM upgrades — never float.
          runtimeContainer: ghcr.io/scanoss/scanoss-py:v1.54.1
          api.key: ${{ secrets.SCANOSS_API_KEY }}
          github.token: ${{ steps.app-token.outputs.token }}
          policies: copyleft
          policies.halt_on_failure: false
          scanMode: delta
          dependencies.enabled: false
          output.filepath: scanoss-results.json

  scanoss-full:
    name: SCANOSS Full Scan (post-merge)
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Remove non-source files that crash SCANOSS
        run: |
          find . -type f \( \
            -name '*.pcap' -o -name '*.pcapng' -o -name '*.tsv' -o -name '*.csv' \
            -o -name '*.bin' -o -name '*.png' -o -name '*.jpg' -o -name '*.jpeg' \
            -o -name '*.gif' -o -name '*.webp' -o -name '*.avif' -o -name '*.svg' \
            -o -name '*.ico' -o -name '*.pdf' \
            -o -name '*.mp3' -o -name '*.mp4' -o -name '*.mov' -o -name '*.wav' \
            -o -name '*.woff' -o -name '*.woff2' -o -name '*.ttf' -o -name '*.otf' \
            -o -name '*.eot' \
            -o -name '*.gz' -o -name '*.tar' -o -name '*.zip' -o -name '*.whl' \
            -o -name '*.7z' -o -name '*.rar' \
            -o -name '*.o' -o -name '*.a' -o -name '*.so' -o -name '*.dylib' \
            -o -name '*.dll' -o -name '*.exe' -o -name '*.class' -o -name '*.jar' \
            -o -name '*.pyc' -o -name '*.pdi' -o -name '*.xsa' -o -name '*.elf' \
            -o -name '*.hpu' -o -name '*.bcode' -o -name '*.cbor' \
          \) -delete 2>/dev/null || true
          rm -rf Datasets assets node_modules __pycache__ .venv bmenv .next dist build 2>/dev/null || true

      - name: SCANOSS Full Scan
        uses: scanoss/gha-code-scan@v1
        with:
          # Pinned to match the ORT VM's scanoss-py (upgraded 2026-07-17).
          # Bump deliberately alongside VM upgrades — never float.
          runtimeContainer: ghcr.io/scanoss/scanoss-py:v1.54.1
          api.key: ${{ secrets.SCANOSS_API_KEY }}
          github.token: ${{ steps.app-token.outputs.token }}
          policies: copyleft
          policies.halt_on_failure: false
          scanMode: full
          dependencies.enabled: false
          output.filepath: scanoss-results.json

  trigger-ort:
    name: Trigger ORT Scan
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    # The dispatch pool, not plain `self-hosted`. The webhook is on the ORT VM,
    # inside the network, so a GitHub-hosted runner cannot reach it; but
    # `self-hosted` alone landed on any org runner -- the build runners on tron,
    # momo and gollum, which are being retired (NiobiumInc/slurm#1505), and the
    # Macs. The dispatchers sit on the same internal CI hosts and this job is one
    # HTTP call, which fits their 2 CPUs / 8G. (They serve private repos only, as
    # the org's self-hosted runners always have.)
    runs-on: [self-hosted, slurm-dispatch]
    steps:
      - name: Check if ORT scan needed
        id: check
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Skip if only NOTICE changed
        id: filter
        run: |
          CHANGED=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || echo "FORCE_SCAN")
          if [ "$(echo "$CHANGED" | grep -v '^NOTICE$' | grep -v '^$')" = "" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger ORT scan via webhook
        if: steps.filter.outputs.skip != 'true'
        env:
          ORT_WEBHOOK_URL: ${{ vars.ORT_WEBHOOK_URL }}
          ORT_WEBHOOK_TOKEN: ${{ secrets.ORT_WEBHOOK_TOKEN }}
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          # The token reaches curl on stdin (`-H @-`), not on its command line:
          # a self-hosted runner shares its host with other users, and every
          # process's argv is readable by all of them (ps). printf is a shell
          # builtin, so the token is on no argv at all. The response goes to
          # the job's own temp dir rather than the host's shared /tmp.
          resp="$RUNNER_TEMP/ort-response.json"
          HTTP_CODE=$(printf 'Authorization: Bearer %s\n' "$ORT_WEBHOOK_TOKEN" \
            | curl -s -o "$resp" -w "%{http_code}" -X POST "$ORT_WEBHOOK_URL/scan" \
                -H @- -H "Content-Type: application/json" \
                -d "{\"provider\": \"github\", \"repo\": \"${REPO_NAME}\"}")
          echo "HTTP $HTTP_CODE"
          cat "$resp"
          if [ "$HTTP_CODE" = "202" ]; then
            echo "::notice::ORT scan triggered for $REPO_NAME"
          else
            echo "::warning::ORT webhook returned $HTTP_CODE — scan may not have started"
          fi
