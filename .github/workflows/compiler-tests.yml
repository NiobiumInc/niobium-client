# .github/workflows/compiler-tests.yml
#
# Commit this (exact path/filename) to each of: niobium-fhetch, niobium-haze,
# niobium-client. The runner group `gcp-ephemeral` is pinned to this path
# @refs/heads/main, so the filename must match.
#
# ===========================================================================
# HARD REQUIREMENT: NO nbcc / compiler output in the public Actions log.
# Public repos => Actions logs AND artifacts are world-readable, with no per-job
# privacy toggle. So every compiler invocation sends stdout+stderr to /dev/null
# and we surface ONLY the exit status (PASS / FAIL). Debug failures locally.
# Do NOT: echo compiler output, `set -x`, upload trace artifacts, or print the
# SDK version. (A private Cloud Logging sink is available but OFF by default —
# see the commented block; enable only when you're comfortable with the trace
# leaving the runner.)
# ===========================================================================
#
# Runs on pull_request + push to main, in addition to workflow_dispatch.
# PR runs on a public-repo self-hosted runner are collaborator-gated by
# GitHub itself: first-time contributors require maintainer approval before
# any workflow touching self-hosted runners executes ("Require approval for
# first-time contributors" under Settings > Actions > General). Do not
# disable that setting as a side effect of this trigger.
# Never use pull_request_target with a checkout of the PR head.

name: compiler-tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

# Least privilege: the job only needs to read the repo for checkout. Minimizes
# the GITHUB_TOKEN scope on a public-repo self-hosted runner (don't widen this
# without cause).
permissions:
  contents: read

concurrency:
  group: compiler-tests-${{ github.ref }}
  # cancel-in-progress: true cancels in-flight runs on rapid PR pushes / rapid
  # pushes to main. Acceptable here — each run is a from-scratch VM anyway.
  cancel-in-progress: true

jobs:
  compiler-tests:
    name: Compiler tests (self-hosted, GCP)
    runs-on: [self-hosted, gcp-ephemeral, "run-${{ github.run_id }}"]
    timeout-minutes: 60   # OpenFHE cold-build ~15 min + mult E2E
    env:
      SDK: /mnt/niobium-sdk/sdk   # mounted RO at boot by runner-startup.sh
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          submodules: recursive

      - name: Pin branch SDK (lockstep changes only — .sdk-pin)
        # No-op without a .sdk-pin file at the repo root. With one, the named
        # sdk-branch-* release's tarball is fetched from the GCS mirror,
        # checksum-verified against its .sha256 sidecar, and BIND-MOUNTED over
        # the nightly SDK, so every later step -- including anything that
        # hardcodes the mount path -- sees the pin. A GITHUB_ENV write would
        # not do that: this job defines SDK as job-level env, which GITHUB_ENV
        # does not reliably override. The pin proves itself by mount identity
        # (the SDK path now IS the extracted tree) plus the SDK contract file;
        # the bundle's own VERSION is logged, not asserted -- the compiler
        # writes the version string there, not the tag. Hard-fails on main so
        # a pin cannot be merged.
        run: |
          set -e
          [ -f .sdk-pin ] || { echo "no .sdk-pin — nightly SDK"; exit 0; }
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            echo "::error::.sdk-pin must not exist on main — remove it in the merge"; exit 1
          fi
          TAG="$(tr -d ' \r\n' < .sdk-pin)"
          case "$TAG" in sdk-branch-*) ;; *) echo "::error::.sdk-pin must name an sdk-branch-* tag"; exit 1;; esac
          DEST="$RUNNER_TEMP/branch-sdk"; mkdir -p "$DEST"
          SRC="gs://github-runner-499901-sdk-branches/$TAG"
          # The compiler build takes 15-25 min on the happy path (up to 3 h if
          # it queues behind a running nightly) and its tarball lands in the
          # bucket as it finishes; a PR opened right after the dispatch waits
          # here instead of failing and asking for a rerun.
          for i in $(seq 1 60); do
            gcloud storage ls "$SRC/*.tar.*" >/dev/null 2>&1 && break
            [ "$i" -eq 1 ] && echo "$TAG not in the mirror yet -- waiting up to 30 min for the compiler build"
            sleep 30
          done
          gcloud storage cp "$SRC/*.tar.*" "$DEST/" --quiet \
            || { echo "::error::$TAG still not in the mirror after 30 min -- check the release-binary-sdk run on the compiler branch, and that the tag is exactly right"; exit 1; }
          # Two objects arrive: the tarball and its .sha256 sidecar. Name the
          # tarball explicitly (a bare *.tar.* glob would hand tar the sidecar
          # as a member to extract) and verify against the sidecar while it is here.
          TARBALL="$(find "$DEST" -maxdepth 1 -name '*.tar.*' ! -name '*.sha256' | head -1)"
          [ -n "$TARBALL" ] || { echo "::error::no tarball in $DEST"; exit 1; }
          ( cd "$DEST" && sha256sum -c ./*.sha256 ) || { echo "::error::checksum mismatch for $TAG"; exit 1; }
          tar -xf "$TARBALL" -C "$DEST"
          SDKDIR="$(dirname "$(find "$DEST" -maxdepth 2 -name bin -type d | head -1)")"
          [ -x "$SDKDIR/bin/nbcc_fhetch_replay" ] \
            || { echo "::error::$TAG has no bin/nbcc_fhetch_replay -- not an SDK bundle this job can use"; exit 1; }
          sudo mount --bind "$SDKDIR" "$SDK"
          [ "$(stat -c %d:%i "$SDK")" = "$(stat -c %d:%i "$SDKDIR")" ] \
            || { echo "::error::pin did not take: $SDK is not $SDKDIR after the bind mount"; exit 1; }
          # Bundle-to-tag binding, warning-level: the producers enforce it, but a
          # bundle whose VERSION does not even mention the tag's sha7 is worth a
          # word in the log. The selftest fixture carries the real sha7, so it does
          # not warn; only a bundle mirrored under an unrelated tag would.
          BUNDLE_VERSION="$(cat "$SDK/VERSION" 2>/dev/null || echo n/a)"
          grep -q "${TAG##*-}" <<< "$BUNDLE_VERSION" \
            || echo "::warning::bundle VERSION '$BUNDLE_VERSION' does not mention the tag's sha7 (${TAG##*-})"
          echo "pinned branch SDK: $TAG over $SDK (bundle VERSION: $BUNDLE_VERSION)"
      - name: Verify SDK is mounted (no version printed)
        run: |
          test -x "$SDK/bin/nbcc_fhetch_replay" || { echo "::error::SDK not mounted"; exit 1; }

      - name: Install build tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build

      - name: Build client + fhetch (release)
        # Public C++/OpenFHE output — OK to show; useful for diagnosing build breaks.
        run: make release

      - name: Map the SDK into the layout the Makefile expects
        run: |
          # test-mult-target-release and test-mult-transport-release look for
          # $NIOBIUM_COMPILER_ROOT/build/nbcc_fhetch_replay[_server].
          # The SDK ships bin/ + lib/. Bridge with a shim of symlinks so the
          # replay binary's $ORIGIN rpath and the Makefile's LD_LIBRARY_PATH
          # ($ROOT/build) both resolve correctly through the symlinks.
          SHIM="$RUNNER_TEMP/nbcc-root"
          mkdir -p "$SHIM/build"
          ln -sf "$SDK"/bin/* "$SHIM/build/"
          ln -sf "$SDK"/lib/* "$SHIM/build/"
          test -x "$SHIM/build/nbcc_fhetch_replay" || { echo "::error::SDK missing nbcc_fhetch_replay"; exit 1; }
          echo "NIOBIUM_COMPILER_ROOT=$SHIM" >> "$GITHUB_ENV"
          echo "NIOBIUM_SPEC_DIR=$SDK/share/niobium/devices" >> "$GITHUB_ENV"
          echo "$SHIM/build" >> "$GITHUB_PATH"

      - name: E2E mult — target + transport (PASS/FAIL only, compiler output suppressed)
        run: |
          set +x
          rc=0
          make test-mult-target-release    TARGET=FUNC_SIM >/dev/null 2>&1 || rc=1
          make test-mult-transport-release                 >/dev/null 2>&1 || rc=1
          if [ $rc -eq 0 ]; then
            echo "compiler E2E: PASS"
          else
            echo "::error::compiler E2E FAILED (output suppressed by policy; reproduce locally)"
          fi
          exit $rc
