name: Bug report
description: Something does not work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this.

        **Security vulnerability?** Do not file it here. Use the
        [private report form](https://github.com/NiobiumInc/niobium-client/security/advisories/new).

        **Already have a fix?** This repository does not accept outside pull
        requests, so please describe the fix in words rather than pasting code.
        See [CONTRIBUTING.md](https://github.com/NiobiumInc/niobium-client/blob/HEAD/CONTRIBUTING.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, and what went wrong.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps or input that shows the problem.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release tag, or the output of `git rev-parse HEAD`.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS and version, compiler or Python version, and hardware if relevant.
  - type: textarea
    id: logs
    attributes:
      label: Logs or error output
      description: Paste the relevant output. Remove anything private first.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and this has not been reported.
          required: true
        - label: This is not a security vulnerability.
          required: true
